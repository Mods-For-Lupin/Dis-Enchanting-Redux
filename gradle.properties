# Important Notes:
## Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.0.0
group=com.cursee.examplemod
java_version=21

# Common
mod_name=ExampleMod
mod_author=Lupin, Jason13
mod_id=examplemod
license=Unlicense
