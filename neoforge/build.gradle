plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version

    if (file("./src/main/resources/META-INF/neoforge_accesstransformer.cfg").exists()) {
        println ':neoforge AccessTransformer exists'
        accessTransformers.from "./src/main/resources/META-INF/neoforge_accesstransformer.cfg"
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            clientData()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly 'com.google.auto.service:auto-service:1.0.1'
    annotationProcessor 'com.google.auto.service:auto-service:1.0.1'
    // implementation "curse.maven:monolib-968432:6865016"
    implementation "maven.modrinth:monolib:neoforge-1.21.8-3.0.2"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }